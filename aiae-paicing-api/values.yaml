# Image tags for aiae-paicing-api. Written by the application repository's
# deployment workflows; do not edit by hand.
#
# BOOTSTRAP PLACEHOLDER: no image has been published yet. The first successful
# DEV workflow run replaces every value here with the real immutable tags. The
# child Application on AIAE-helm/dev stays enabled=false until then, so Argo CD
# never attempts to pull these placeholder tags.
#
# Four images, one release: the application, the builder, the fetcher and the
# migrations, all from the same ECR repository and distinguished by tag prefix.
# They are pinned together because a release is only restorable as a complete
# set, and the rollback workflow skips any candidate missing one of the four.
image:
  tag: "0.0.0-bootstrap-000000000000"
  pullPolicy: IfNotPresent
builder:
  image:
    tag: "builder-0.0.0-bootstrap-000000000000"
    pullPolicy: IfNotPresent
fetcher:
  image:
    tag: "fetcher-0.0.0-bootstrap-000000000000"
    pullPolicy: IfNotPresent
migrate:
  image:
    tag: "migrate-0.0.0-bootstrap-000000000000"
    pullPolicy: IfNotPresent
deploymentRevision: "bootstrap"
